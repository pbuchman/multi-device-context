name: Quality
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web && pnpm --filter @mdc/server build
      - run: pnpm test:rules
      - name: Dependency audit
        run: pnpm audit && pnpm audit --prod
      - name: Full-history secret scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --log-opts="--all" .
          "$(go env GOPATH)/bin/gitleaks" dir --redact apps/web/dist
      - name: Browser and legacy profile migration
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          pnpm --filter @mdc/web dev --port 4173 --strictPort > /tmp/mdc-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/e2e.html > /dev/null && break; sleep 1; done
          python apps/web/e2e/context_ui.py
          pnpm exec firebase emulators:exec --project demo-mdc --only firestore,storage 'python apps/web/e2e/history_migration.py'
      - name: Desktop dependency boundary
        env:
          MDC_APP_ORIGIN: https://example.invalid
        run: pnpm --filter @mdc/desktop build && pnpm --filter @mdc/desktop exec node scripts/check-package.mjs
