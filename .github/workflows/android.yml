name: Android checks

on:
  pull_request:
    paths:
      - apps/mobile/**
      - apps/web/**
      - apps/server/**
      - packages/contracts/**
      - scripts/runtime/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest*.ts
      - .github/workflows/android.yml
  push:
    branches: [main, codex/android]
    paths:
      - apps/mobile/**
      - apps/web/**
      - apps/server/**
      - packages/contracts/**
      - scripts/runtime/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest*.ts
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      MDC_APP_ORIGIN: https://context.example.com
      MDC_MOBILE_CONFIG_FIXTURE: ${{ github.workspace }}/apps/mobile/tests/fixtures/runtime-config.json
      MDC_ANDROID_SIGNING_CONFIG: ${{ github.workspace }}/.local/android-ci-no-private-signing.json
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.12.0"
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Shared, server, runtime and mobile configuration tests
        run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:web
      - run: pnpm --filter @mdc/server build
      - name: Verify fixture cannot use private signing
        run: test ! -e "$MDC_ANDROID_SIGNING_CONFIG"
      - name: Build debug APK with explicit synthetic configuration
        run: pnpm --filter @mdc/mobile android:debug
      - name: Android unit tests
        run: pnpm --filter @mdc/mobile android:test
      - name: Android release policy guards
        run: pnpm --filter @mdc/mobile android:guards
      - name: Android lint
        run: pnpm --filter @mdc/mobile android:lint
      - name: Start isolated Android update-test emulator
        run: |
          trap 'code=$?; if [ "$code" -ne 0 ]; then tail -150 "$RUNNER_TEMP/mdc-update-emulator.log" 2>/dev/null || true; fi; exit "$code"' EXIT
          sdkmanager "emulator" "system-images;android-36;google_apis;x86_64"
          printf 'no\n' | avdmanager create avd --force --name mdc_update_ci --package "system-images;android-36;google_apis;x86_64"
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd mdc_update_ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader > "$RUNNER_TEMP/mdc-update-emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q "^1$"; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Verify Android updater on the emulator
        run: |
          apps/mobile/android/gradlew -p apps/mobile/android connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.multidevicecontext.mobile.UpdateSecurityTest
      - name: Preserve Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: android-emulator-diagnostics
          path: ${{ runner.temp }}/mdc-update-emulator.log
          if-no-files-found: ignore
          retention-days: 7
      # Configuration tests assert that fixture mode rejects release generation;
      # Gradle independently rejects fixture release tasks and private signing.
      # No production configuration, private key, or APK publication belongs here.
