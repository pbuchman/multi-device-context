name: Native artifact retention

on:
  workflow_run:
    workflows: [Native installers]
    types: [completed]
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletions without removing artifacts
        type: boolean
        default: true

permissions: {}

concurrency:
  group: native-artifact-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      # workflow_run may be triggered by PRs: execute only trusted main code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Retain latest successful main installers
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const file = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci/artifact-retention.mjs`);
            const { cleanupArtifacts } = await import(file.href);
            await cleanupArtifacts({ github, context, core, dryRun: process.env.DRY_RUN === 'true' });
