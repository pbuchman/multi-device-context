name: Native installers
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/contracts/**
      - pnpm-lock.yaml
      - .github/workflows/native-installers.yml
  pull_request:
    paths:
      - apps/desktop/**
      - packages/contracts/**
      - pnpm-lock.yaml
      - LICENSE
      - .github/workflows/native-installers.yml
  workflow_dispatch:
    inputs:
      require_hosted_ui:
        description: Require the deployed UI and native bridge (mandatory before release)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win
            architecture: x64
          - os: macos-15
            platform: mac
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MDC_APP_ORIGIN: ${{ github.event_name == 'pull_request' && 'https://example.invalid' || vars.MDC_APP_ORIGIN || 'https://example.invalid' }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # identity is explicitly "-" (ad-hoc); no signing secrets enter PR jobs.
      # electron-builder otherwise skips even the required ad-hoc macOS seal.
      CSC_FOR_PULL_REQUEST: "true"
      MDC_REQUIRE_HOSTED_UI: ${{ github.event_name != 'pull_request' && (inputs.require_hosted_ui || vars.MDC_REQUIRE_HOSTED_UI == 'true') }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate native sources and update harness
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdtemp, writeFile, lstat, open, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const directory = await mkdtemp(join(tmpdir(), 'mdc-native-stat-'));
          const path = join(directory, 'synthetic.bin');
          try {
            await writeFile(path, 'synthetic fixture');
            const handle = await open(path, 'r');
            try {
              const fields = ['dev', 'ino', 'size', 'mtimeMs', 'ctimeMs', 'mtimeNs', 'ctimeNs'];
              const select = stat => Object.fromEntries(fields.filter(key => key in stat).map(key => [key, String(stat[key])]));
              console.log(JSON.stringify({ platform: process.platform, node: process.version,
                pathStat: select(await lstat(path)), handleStat: select(await handle.stat()),
                pathBigInt: select(await lstat(path, { bigint: true })), handleBigInt: select(await handle.stat({ bigint: true })) }));
            } finally { await handle.close(); }
          } finally { await rm(directory, { recursive: true, force: true }); }
          NODE
          pnpm vitest run apps/desktop/src
          pnpm --filter @mdc/desktop test:update-harness
      - run: pnpm --filter @mdc/desktop typecheck
      - name: Build platform installers
        run: pnpm --filter @mdc/desktop package:${{ matrix.platform }}
      - name: Verify Windows system certificate trust
        if: runner.os == 'Windows'
        env:
          CI: "true"
        shell: pwsh
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/release/native-system-trust.json'
          pnpm --filter @mdc/desktop exec node scripts/native-system-trust.mjs --output $report
      - name: Verify desktop dependency boundary
        run: pnpm --filter @mdc/desktop exec node scripts/check-package.mjs
      - name: Locate the exact update candidate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync, existsSync } from 'node:fs';
          import { resolve } from 'node:path';
          const { version } = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8'));
          const suffix = process.platform === 'win32' ? 'win-x64.exe' : 'mac-arm64.dmg';
          const artifact = resolve('apps/desktop/release', `Multi-Device-Context-${version}-${suffix}`);
          if (!existsSync(artifact)) throw new Error('The exact native update candidate is missing');
          appendFileSync(process.env.GITHUB_ENV, `MDC_NATIVE_UPDATE_B_VERSION=${version}\nMDC_NATIVE_UPDATE_B_ARTIFACT=${artifact}\n`);
          NODE
      - name: Exercise isolated native A to B update
        env:
          CI: "true"
          MDC_NATIVE_UPDATE_A_TO_B: "1"
        run: pnpm --filter @mdc/desktop test:update-native
      - name: Install Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem apps/desktop/release -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          # Start-Process -Wait also waits for descendants, including the tray app.
          # Wait on the installer process itself, with a bounded failure timeout.
          $result = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S' -PassThru
          if (-not $result.WaitForExit(180000)) { $result.Kill(); throw 'Installer timed out' }
          if ($result.ExitCode -ne 0) { throw 'Installer failed' }
          Get-Process -Name 'Multi Device Context' -ErrorAction SilentlyContinue | Stop-Process
          $installed = @(Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Multi Device Context.exe')
          if ($installed.Count -ne 1) { throw 'Installed executable not found' }
          "MDC_NATIVE_EXECUTABLE=$($installed[0].FullName)" >> $env:GITHUB_ENV
          $signature = Get-AuthenticodeSignature $installed[0].FullName
          if ($signature.Status -ne 'NotSigned') { throw 'Unexpected Windows signing status' }
      - name: Install macOS artifact and verify ad-hoc signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          volume="$RUNNER_TEMP/mdc-volume"
          destination="$RUNNER_TEMP/mdc-installed"
          mkdir -p "$volume" "$destination"
          dmg=(apps/desktop/release/*.dmg)
          test "${#dmg[@]}" = 1
          hdiutil attach -readonly -nobrowse -mountpoint "$volume" "${dmg[0]}"
          ditto "$volume/Multi Device Context.app" "$destination/Multi Device Context.app"
          hdiutil detach "$volume"
          codesign --verify --deep --strict "$destination/Multi Device Context.app"
          codesign -dv "$destination/Multi Device Context.app" 2> "$RUNNER_TEMP/mdc-signature.txt"
          grep -q 'Signature=adhoc' "$RUNNER_TEMP/mdc-signature.txt"
          echo "MDC_NATIVE_EXECUTABLE=$destination/Multi Device Context.app/Contents/MacOS/Multi Device Context" >> "$GITHUB_ENV"
      - name: Inspect installed ASAR
        run: pnpm --filter @mdc/desktop exec node scripts/check-installed.mjs
      - name: Exercise installed native application
        run: pnpm --filter @mdc/desktop exec node scripts/native-smoke.mjs
      - name: Produce checksums
        run: pnpm --filter @mdc/desktop exec node scripts/checksums.mjs
      - name: Preserve native update diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-update-report-${{ matrix.platform }}-${{ matrix.architecture }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/desktop/release/native-update-a-to-b.json
            apps/desktop/release/native-update-launch.png
            apps/desktop/release/native-update-launch-sample.txt
            apps/desktop/release/native-smoke.json
            apps/desktop/release/native-system-trust.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # PRs still build and test; publish only verified main installers.
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: native-${{ matrix.platform }}-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/native-smoke.json
            apps/desktop/release/native-system-trust.json
            apps/desktop/release/native-smoke.png
            apps/desktop/release/native-update-a-to-b.json
